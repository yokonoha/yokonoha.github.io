
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027年まで... - 横茶横葉のサイト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;

      background-color: #739623;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 48px);
      margin-bottom: 15px;
    }

    .subtitle {
      color: #b8c8e8;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .unit {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 2px;
      padding: 20px 15px;
      min-width: 100px;
      backdrop-filter: blur(10px);
    }

    .number {
      font-size: clamp(35px, 7vw, 60px);
      font-weight: bold;
      color: #ffc21c;
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-size: 15px;
      color: #d0dcf5;
      margin-top: 8px;
    }

    #message {
      margin-top: 35px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1> 当サイト更新終了まで...</h1>
    <div class="subtitle">製作活動終了・アーカイブ化まで</div>

    <div class="countdown">
      <div class="unit">
        <div class="number" id="days">000</div>
        <div class="label">日</div>
      </div>

      <div class="unit">
        <div class="number" id="hours">00</div>
        <div class="label">時間</div>
      </div>

      <div class="unit">
        <div class="number" id="minutes">00</div>
        <div class="label">分</div>
      </div>

      <div class="unit">
        <div class="number" id="seconds">00</div>
        <div class="label">秒</div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <script>

    const target = new Date("2027-01-01T00:00:00+09:00").getTime();//JTC!

    function updateCountdown() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById("days").textContent = "000";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.getElementById("message").textContent =
          "新年あけましておめでとうございます! そして、2027年まで「横茶横葉のサイト」を支えてくださいまして誠にありがとうございました!  あなたにとって最高の一年となりますように。";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent =
        String(days).padStart(3, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
